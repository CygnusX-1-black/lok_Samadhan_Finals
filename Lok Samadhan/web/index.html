<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Lok Samadhan - Multilingual Citizen Voice Grievance Redressal Portal. Fast, accessible, and responsive across all mobile and desktop devices.">
  <meta name="theme-color" content="#0B192C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lok Samadhan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lok Samadhan - Voice Grievance Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* PWA Install Banner */
    #pwa-install-banner {
      display: none;
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: #FFFFFF;
      border: 1.5px solid #0B192C;
      box-shadow: 0 10px 30px rgba(11, 25, 44, 0.25);
      border-radius: 14px;
      padding: 10px 16px;
      align-items: center;
      gap: 14px;
      animation: pwaSlideDown 0.4s ease-out;
      max-width: 92vw;
    }
    @keyframes pwaSlideDown {
      from { transform: translate(-50%, -40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    #pwa-install-btn {
      background: #E65100;
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(230, 81, 0, 0.35);
    }
    #pwa-install-btn:hover {
      background: #BF360C;
    }
    #pwa-close-btn {
      background: transparent;
      border: none;
      color: #64748B;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    /* Universal Responsive App Preloader */
    #app-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(145deg, #0B192C 0%, #1E3E62 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #app-loader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 90vw;
      width: 360px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .loader-logo-wrap {
      position: relative;
      width: 76px;
      height: 76px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader-logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      position: relative;
      z-index: 2;
    }
    .loader-pulse {
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border-radius: 20px;
      border: 2px solid rgba(255, 153, 51, 0.7);
      animation: logoPulse 1.8s infinite ease-out;
    }
    @keyframes logoPulse {
      0% { transform: scale(0.95); opacity: 0.9; }
      100% { transform: scale(1.22); opacity: 0; }
    }

    .loader-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .loader-hindi {
      color: #FF9933;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .loader-subtitle {
      color: #94A3B8;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    /* Tiranga Tricolor Line */
    .tiranga-line {
      display: flex;
      width: 140px;
      height: 4px;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .tiranga-saffron { flex: 1; background: #FF9933; }
    .tiranga-white { flex: 1; background: #FFFFFF; }
    .tiranga-green { flex: 1; background: #138808; }

    /* Animated spinner */
    .spinner-ring {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #FF9933;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-status {
      color: #CBD5E1;
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Universal Loading Screen (Fades out automatically when Flutter is ready) -->
  <div id="app-loader">
    <div class="loader-card">
      <div class="loader-logo-wrap">
        <div class="loader-pulse"></div>
        <img class="loader-logo" src="icons/Icon-192.png" alt="Lok Samadhan" onerror="this.style.display='none'" />
      </div>
      <div class="loader-title">Lok Samadhan</div>
      <div class="loader-hindi">लोक समाधान पोर्टल • લોક સમાધાન પોર્ટલ</div>
      <div class="tiranga-line">
        <div class="tiranga-saffron"></div>
        <div class="tiranga-white"></div>
        <div class="tiranga-green"></div>
      </div>
      <div class="loader-subtitle">Citizen Voice Grievance Redressal System</div>
      <div class="spinner-ring"></div>
      <div id="loader-status-text" class="loader-status">Connecting securely...</div>
    </div>
  </div>

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner">
    <img src="icons/Icon-192.png" width="36" height="36" style="border-radius: 8px;" alt="Logo" />
    <div style="text-align: left;">
      <div style="font-weight: 800; font-size: 13.5px; color: #0B192C;">Install Lok Samadhan App</div>
      <div style="font-size: 11px; color: #64748B;">Install on your phone or PC for instant 1-tap offline access</div>
    </div>
    <button id="pwa-install-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Install App
    </button>
    <button id="pwa-close-btn" onclick="document.getElementById('pwa-install-banner').style.display='none'">✕</button>
  </div>

  <script>
    // 1. Status updater for preloader
    const statusText = document.getElementById('loader-status-text');
    const statusSteps = [
      { delay: 800, text: "Optimizing for your device..." },
      { delay: 1800, text: "Loading voice & redressal modules..." },
      { delay: 3200, text: "Starting user interface..." }
    ];
    statusSteps.forEach(s => {
      setTimeout(() => {
        if (statusText && !document.getElementById('app-loader').classList.contains('loaded')) {
          statusText.textContent = s.text;
        }
      }, s.delay);
    });

    // 2. Hide loader once Flutter DOM elements or first frame appears
    function hideAppLoader() {
      const loader = document.getElementById('app-loader');
      if (loader && !loader.classList.contains('loaded')) {
        loader.classList.add('loaded');
        setTimeout(() => {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 600);
      }
    }

    // Observe body for Flutter DOM elements
    const observer = new MutationObserver((mutations, obs) => {
      const flt = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view') || document.querySelector('canvas');
      if (flt) {
        setTimeout(hideAppLoader, 200);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Failsafe maximum timer: loader never gets stuck
    setTimeout(hideAppLoader, 8000);

    // 3. PWA install prompt handler
    let deferredPrompt = null;
    const banner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('pwa-install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (banner) banner.style.display = 'flex';
    });

    setTimeout(() => {
      if (!window.matchMedia('(display-mode: standalone)').matches && banner && banner.style.display !== 'flex') {
        banner.style.display = 'flex';
      }
    }, 3500);

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted' && banner) {
            banner.style.display = 'none';
          }
          deferredPrompt = null;
        } else {
          alert('To install Lok Samadhan on your device:\n\n• On Chrome/Edge: Click the Install icon in the address bar (⊕ or 💻)\n• On Android: Tap browser menu (⋮) -> "Add to Home screen"\n• On iPhone: Tap Share (⎙) -> "Add to Home Screen"');
        }
      });
    }

    window.addEventListener('appinstalled', () => {
      if (banner) banner.style.display = 'none';
      deferredPrompt = null;
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
